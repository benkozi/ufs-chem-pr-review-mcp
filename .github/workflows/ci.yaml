name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check code formatting (ruff format)
        run: uv run ruff format --check

      - name: Lint source code (ruff check)
        run: uv run ruff check

      - name: Type checking (mypy)
        run: uv run mypy

      - name: YAML linting (yamllint)
        run: uv run yamllint .

  test-suite:
    name: Test Suite & 100% Coverage Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run unit test suite with 100% coverage requirement
        run: uv run pytest --cov=ufs_chem_pr_review_mcp --cov-report=term-missing --cov-fail-under=100
