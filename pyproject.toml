[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ufs-chem-pr-review-mcp"
version = "0.1.0"
description = "Local Model Context Protocol (MCP) server providing historical review context, classification, and ponytail-aligned code review for UFS-Chem repositories"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.12,<2",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.scripts]
ufs-chem-pr-review-mcp = "ufs_chem_pr_review_mcp.server:main"
ufs-chem-pr-review-sync = "ufs_chem_pr_review_mcp.cli.sync:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ufs_chem_pr_review_mcp"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
    "yamlfix>=1.16",
    "yamllint>=1.35",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "-m", "not integration"]
markers = [
    "integration: live GitHub API network calls (deselected by default)",
]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "T20"]  # T20 forbids print() statements via flake8-print
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
